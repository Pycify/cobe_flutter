name: cobe_flutter
description: A Flutter package that recreates the COBE globe with markers, arcs, and overlay projections.
version: 0.1.0
homepage: https://github.com/gabbygreat/cobe_flutter
repository: https://github.com/gabbygreat/cobe_flutter
issue_tracker: https://github.com/gabbygreat/cobe_flutter/issues
topics:
  - globe
  - maps
  - visualization
  - flutter-widget
  - canvas

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  assets:
    - assets/texture.png
    - assets/countries.geojson
